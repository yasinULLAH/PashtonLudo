name: Build Offline Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'build pwa make html app offline and installable yasin best working re-run this for updates best for html only.pyw'
      - 'transcript of the vioces.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Offline Web Assets
        run: python .github/scripts/prepare_offline.py

      - name: Install Capacitor & Initialize Android
        run: |
          npm init -y
          npm install --save-dev @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Bannu Royale Ludo" "com.yasinullah.bannuroyaleludo" --web-dir www
          npx cap add android

      - name: Configure App Icons and Android Manifest
        run: python .github/scripts/configure_android.py

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BannuRoyaleLudo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BannuRoyaleLudo-APK
          path: BannuRoyaleLudo.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "Bannu Royale Ludo - Offline APK (Build ${{ github.run_number }})"
          body: "Standalone fully offline working APK generated automatically from commit ${{ github.sha }}."
          files: BannuRoyaleLudo.apk

